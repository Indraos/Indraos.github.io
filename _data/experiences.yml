# Vita entries. The website shows place, time, title and description, plus
# the honors and service that list the same place (under the first entry
# for that place); `website: false` keeps an entry off the website. The CV and resume
# (built by cv/build.py) also read:
#   cv_section      CV section to list the entry in (see _data/cv.yml)
#   degree          CV title for education entries
#   cv_description  replaces the description on the CV ("" to omit)
#   cv_details      bullet points shown only on the CV
#   resume          puts the entry on the resume, with shorter wording (place,
#                   time, url, title, description; style: line puts the
#                   entry on a single line)
