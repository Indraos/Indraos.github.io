- title: "TaskNet: Building Occupational Task Inventories from Worker Interviews at Scale"
  short_title: "TaskNet"
  authors: "J. Wang<sup>‡</sup>, <b>A. Haupt</b><sup>‡</sup>, I. Robinson, P. Lewis, E. Brynjolfsson<sup>†</sup>, D. Yang<sup>†</sup>"
  venue: "SSRN Preprint 7670419, 2026."
  date: 2026-10-25
  pdf: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7670419"
  type: "Preprint"
  resume: true
  tags: ["Work", "AI Evaluation"]
  figure: "figures/tasknet.svg"
  figure_caption: "From worker interviews to an occupational task inventory, with the counts from the six-occupation pilot."
  summary: >-
    Every estimate of how AI affects jobs rests on an inventory of what workers actually
    do—and the public inventory, O*NET, is updated slowly. TaskNet interviews incumbent
    workers with a mixed-initiative language-model interviewer, standardizes their reports
    into task statements, and aggregates them into occupational inventories. In six
    occupations, 132 workers produced 2,726 reports that became 202 task statements; O*NET
    analysts accepted all of them (versus ~65% of write-in suggestions under the standard
    process); 318 further incumbents validated them with 7,923 ratings. The inventory covers
    89% of held-out workers' tasks (O*NET: 79%) and adds 79 tasks missing from the published
    list. AI-exposure estimates shift in both directions—upward for software developers and
    lawyers. Built with the National Center for O*NET Development and Mercor; a
    250-occupation scale-up is in preparation.

- title: "Contextually Private Mechanisms"
  authors: "<b>A. Haupt</b><sup>‡</sup>, Z. Hitzig<sup>‡</sup>"
  venue: "American Economic Review 116 (9), p. 3223-3262 (Lead Article), 2026."
  date: 2026-09-01
  pdf: "https://arxiv.org/abs/2112.10812"
  html: "https://www.aeaweb.org/articles?id=10.1257/aer.20240579"
  type: "Published"
  resume: true
  important: true
  contribution: "Equal contribution with Z. Hitzig (50% each); authors in alphabetical order, as is customary in economics. Lead article of the issue."
  tags: ["Privacy", "Market Design"]
  figure: "figures/contextually-private.svg"
  figure_caption: "The corners lemma: when two agents are jointly but not individually pivotal, whoever is asked first is told apart from a profile with the same outcome, so no protocol implementing the rule is contextually private."
  summary: >-
    Mechanism design usually asks <i>what</i> to implement and models the mechanism as a
    one-shot report of types. This paper studies the extensive form instead: a protocol asks
    participants questions one at a time, and what it learns depends on which question it
    asks, of whom, and when. A protocol violates contextual privacy when it tells two people
    apart who would have received the same outcome anyway. Violations are unavoidable
    exactly when agents are collectively, but not individually, pivotal. Beyond that, the
    order of questions is a design choice: delaying a question until its answer is needed
    for the outcome means fewer people are told apart for no reason, so delay improves
    privacy, and different extensive forms of the same allocation rule can differ sharply in
    how much they learn. The paper connects auction theory to Helen Nissenbaum's contextual
    integrity: "information not needed for the outcome" becomes a theorem about protocols.

