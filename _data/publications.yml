- title: "The Collapse of Heterogeneity in Silicon Philosophers"
  authors: "Y. Shi, <b>A. Haupt</b>"
  venue: "ACM Conference on Fairness, Accountability, and Transparency, 2026."
  date: 2026-06-25
  pdf: "https://dl.acm.org/doi/10.1145/3805689.3806760"
  code: "https://github.com/stanford-del/silicon-philosophers"
  type: "Published"
  resume: true
  tags: ["AI Evaluation", "Preferences"]
  figure: "figures/silicon-philosophers.svg"
  figure_caption: "Philosophers' positions across questions are dispersed; the models' positions line up, manufacturing consensus where the profession disagrees (schematic)."
  summary: >-
    Can a language model stand in for an expert panel? We tested seven models against 277
    professional philosophers and the PhilPapers survey (<i>N</i> = 1,785). Models reproduce
    individual positions tolerably, but they over-correlate judgments across questions,
    manufacturing consensus where the profession disagrees—partly a "specialist effect": the
    model assumes specialists in a domain share views. For anyone using "silicon samples" as
    proxies for publics, the heterogeneity collapses exactly where it matters.

