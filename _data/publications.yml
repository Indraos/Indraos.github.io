- title: "Welfare, Improvability, and Variance: A Principal-Agent Approach to Optimal Benchmark Item Aggregation"
  short_title: "Optimal Benchmark Item Aggregation"
  authors: "<b>A. Haupt</b><sup>‡</sup>, J. Hartenstein<sup>‡</sup>, A. Reuel, M. Kochenderfer, S. Koyejo"
  venue: "Advances in Neural Information Processing Systems (Evaluations and Datasets Track), 2026."
  date: 2026-12-01
  pdf: "https://arxiv.org/abs/2605.30916"
  html: "https://openreview.net/forum?id=yF6rmSx7l7"
  type: "Published"
  resume: true
  important: true
  contribution: "First author; shared first authorship with J. Hartenstein (equal contribution, 50% each of the joint work); M. Kochenderfer and S. Koyejo are senior co-authors."
  tags: ["AI Evaluation", "Aggregation", "Market Design"]
  figure: "figures/benchmark-weights.svg"
  figure_caption: "The optimal weight of an item rises with its welfare relevance and improvability and falls with its variance. Improvability is estimated from what a 10% improvement costs on the EvoLM 4B suite; the table shows one OLMES item per improvability quantile from the paper's Table 1."
  summary: >-
    A benchmark is reported as a measurement but works as an incentive: once labs optimize
    against it, the weight on each item steers effort. We model benchmark aggregation as a
    multitask principal–agent problem. The optimal item weights have a closed form,
    <i>v</i>* = (<i>M</i> + <i>r</i>Σ)<sup>−1</sup><i>Mw</i>—higher for items that matter
    for welfare (<i>w</i>) and that effort can improve (<i>M</i>), lower for noisy items (Σ)
    when the lab is risk-averse (<i>r</i>). On the OLMES suite, with welfare weights from
    workers' own task ratings, all 52 mathematics items are Pareto-dominated by
    general-knowledge items under a pro-worker welfare definition, and only ~6% of the
    suite's "automation loading" falls on activities workers want automated. Evaluation
    designers should publish <i>why</i> each item carries the weight it does.

- title: "Reward Bias Substitution: Single-Axis Bias Mitigations Redirect Optimization Pressure"
  authors: "M. Lamparth, D. Fein, <b>A. Haupt</b>, M. Hussing, M.J. Kochenderfer"
  venue: "Advances in Neural Information Processing Systems, 2026."
  date: 2026-12-01
  pdf: "https://arxiv.org/abs/2605.27996"
  type: "Published"
  tags: ["Preferences"]
  figure: "figures/reward-bias.svg"
  figure_caption: "A length penalty lowers the length bias, but the optimization pressure resurfaces as overconfidence (schematic)."
  summary: >-
    Fixing one bias in a reward model (length, sycophancy, style) can simply redirect
    optimization pressure elsewhere. We prove that success, substitution, and overcorrection
    are indistinguishable under the audit distributions on which mitigations are usually
    reported—even with an oracle true reward. Empirically, a length penalty under GRPO
    shifts pressure into overconfidence with lower factual accuracy, and a published
    length-debiasing operator's bias reappears under best-of-<i>n</i> sampling for three of
    four state-of-the-art reward models. Prescription: evaluate under the policy-induced
    distribution and track several biases at once.

