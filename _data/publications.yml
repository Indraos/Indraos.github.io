- title: "Certification Design for a Competitive Market"
  authors: "<b>A. Haupt</b><sup>‡</sup>, N. Immorlica<sup>‡</sup>, B. Lucier<sup>‡</sup>"
  venue: "ACM Conference on Economics and Computation, 2024."
  date: 2024-07-01
  pdf: "https://dl.acm.org/doi/10.1145/3670865.3673593"
  type: "Published"
  resume: true
  tags: ["Market Design"]
  figure: "figures/certification.svg"
  figure_caption: "The certifier partitions unobservable quality into priced certificate tiers; sellers choose both their quality and their certificate (schematic)."
  summary: >-
    Certification is the market's answer to unobservable quality, from carbon credits to
    educational tests to AI models. We study a certifier that designs and prices
    certificates while sellers choose both quality and certificate and prices form
    competitively. Under single crossing, sellers' certification choices are uniquely pinned
    down; the revenue-maximizing certifier's problem reduces to monopoly pricing with
    non-linear valuations, for which we give an FPTAS; and both welfare- and revenue-optimal
    certificate menus can be arbitrarily large.

