- title: "AI should not be an imitation game: Centaur evaluations"
  short_title: "Centaur Evaluations"
  authors: "<b>A. Haupt</b>, E. Brynjolfsson"
  venue: "International Conference on Machine Learning (Position Paper), 2025."
  date: 2025-07-01
  pdf: "https://openreview.net/forum?id=LkdH35003E"
  type: "Published"
  resume: true
  tags: ["AI Evaluation", "Work"]
  figure: "figures/centaur-evaluations.svg"
  figure_caption: "A centaur evaluation scores the uplift of a human–AI team over either alone, instead of the AI by itself."
  summary: >-
    Standalone benchmarks reward AI for replacing people. Centaur evaluations instead
    measure what a <i>human–AI team</i> achieves—the uplift over either alone—and thereby
    make human-centred properties (interpretability, helpfulness, complementarity)
    first-class objectives rather than afterthoughts. The paper argues that such evaluations
    are both more demanding and more realistic than current leaderboards, and sets out a
    research program: who the humans are, how to randomize access, how to score teams. It is
    the conceptual basis for AlignmentBench (interview-then-predict), SimulacraBench, and
    the AI-oral-assessment study.

- title: "Convex Markov Games: A New Frontier for Multi-Agent Reinforcement Learning"
  short_title: "Convex Markov Games"
  authors: "I. Gemp, <b>A. Haupt</b>, L. Marris, S. Liu, G. Piliouras"
  venue: "International Conference on Machine Learning, 2025."
  date: 2025-07-01
  pdf: "https://proceedings.mlr.press/v267/gemp25a.html"
  type: "Published"
  resume: true
  tags: ["Multi-Agent"]
  figure: "figures/convex-markov-games.svg"
  figure_caption: "Preferences over occupancy measures: linear in a Markov game, any convex function in a convex Markov game."
  summary: >-
    Multi-agent reinforcement learning assumes rewards add up over time. Many objectives do
    not: diversity, imitation, fairness, safety. Convex Markov games let players hold
    general convex preferences over occupancy measures, strictly generalizing Markov games
    (including infinite horizon). Pure-strategy Nash equilibria exist, and we approximate
    them by gradient descent on an exploitability bound. In the prisoner's dilemma,
    "transient imitation" recovers a profile close to human play with higher utility and
    roughly a thousand-fold lower exploitability; experiments also show fairer coordination
    and safer robot-warehouse behaviour.

