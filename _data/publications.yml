- title: "Platform Preferencing and Price Competition I: Evidence from Amazon"
  short_title: "Platform Preferencing and Price Competition I"
  authors: "O. Hartzell<sup>‡</sup>, <b>A. Haupt</b><sup>‡</sup>"
  venue: "SSRN Preprint 5126918, 2025."
  date: 2025-01-01
  pdf: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5126918"
  type: "Preprint"
  resume: true
  tags: ["Platforms"]
  figure: "figures/buy-box.svg"
  figure_caption: "Ranges across product categories in a third-party seller's records, 2016–2022."
  summary: >-
    How does a hybrid platform's placement rule—the Buy Box—shape prices, and is Amazon
    biased toward its own offers? Theory: the consumer-optimal scoring rule is linear in
    consumer-preference coefficients minus price, and the Reimers–Waldfogel bias test
    remains valid when prices respond to the rule. Data: a high-volume third-party seller's
    records for 1,000+ products over 2016–2022. Amazon wins the Buy Box 39–85% of the time
    by category when it has an offer; the Buy Box is the cheapest offer only 54–63% of the
    time; an objectively worse offer wins 14–24% of the time.

- title: "Risk Preferences of Learning Algorithms"
  authors: "<b>A. Haupt</b><sup>‡</sup>, A. Narayanan<sup>‡</sup>"
  venue: "Games and Economic Behavior 148, p. 415-426, 2024."
  date: 2024-11-01
  pdf: "https://www.sciencedirect.com/science/article/abs/pii/S089982562400143X"
  type: "Published"
  resume: true
  tags: ["Multi-Agent", "Preferences"]
  figure: "figures/risk-preferences.svg"
  figure_caption: "Two actions with the same expected payoff: ε-greedy learning ends up choosing the low-variance one."
  summary: >-
    Standard bandit algorithms are not risk-neutral. ε-greedy learning is <i>emergently
    risk-averse</i>: between two actions with equal expected payoff it picks the
    lower-variance one with probability approaching one, and transiently even when the
    riskier action is strictly better on average. In a recommender or marketplace this
    favours measurable, homogeneous options and produces inequity and homogenization. Two
    corrections—reweighting data by how often an action was chosen, or optimistic estimates
    for rarely-chosen actions—restore risk neutrality.

- title: "Formal Contracts Mitigate Social Dilemmas in Multi-Agent Reinforcement Learning"
  short_title: "Formal Contracts Mitigate Social Dilemmas in MARL"
  authors: "<b>A. Haupt</b><sup>‡</sup>, P. Christoffersen<sup>‡</sup>, M. Damani, D. Hadfield-Menell"
  venue: "Autonomous Agents and Multi-Agent Systems 38, Article 51, 2024."
  date: 2024-10-01
  pdf: "https://link.springer.com/article/10.1007/s10458-024-09682-5"
  code: "https://github.com/Algorithmic-Alignment-Lab/contracts"
  type: "Published"
  resume: true
  important: true
  contribution: "First author; shared first authorship with P. Christoffersen (equal contribution, 50% each of the joint work); D. Hadfield-Menell is the senior co-author."
  tags: ["Multi-Agent", "Market Design"]
  figure: "figures/formal-contracts.svg"
  figure_caption: "A contracting stage before the game: agents propose and accept reward transfers, then play."
  summary: >-
    Add a contracting stage to a Markov game—agents can voluntarily bind themselves to
    reward transfers—and, with a rich enough contract space, every subgame-perfect
    equilibrium of a fully observable Markov game is socially optimal; richer spaces weakly
    raise welfare in general, including under partial observability. The MOCA algorithm
    makes this learnable, validated in traffic, pollution, and common-pool-resource
    environments.

