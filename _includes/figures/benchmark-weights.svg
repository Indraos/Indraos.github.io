<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 226" role="img" aria-labelledby="benchmark-weights-title">
<title id="benchmark-weights-title">The optimal item weights depend on welfare, improvability and variance; improvability is estimated from the cost of a 10% improvement by pretraining, SFT or RL, shown for one item per quantile.</title>
<defs><marker id="benchmark-weights-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<text class="fg-text" x="130" y="40" text-anchor="middle" style="font-size:24px;font-family:Palatino Linotype, Palatino, serif"><tspan style="font-style:italic">v</tspan>* = (<tspan class="fg-accent-text" style="font-size:24px">M</tspan> + <tspan style="font-style:italic">r</tspan>Σ)⁻¹ <tspan class="fg-accent-text" style="font-size:24px">M</tspan> <tspan style="font-style:italic">w</tspan></text>
<text class="fg-muted" x="130" y="60" text-anchor="middle" >optimal weight of each benchmark item</text>
<text class="fg-small" x="270" y="28" text-anchor="start" >w  welfare: how much the item matters to workers</text>
<text class="fg-small" x="270" y="42" text-anchor="start" >Σ  variance: how noisy the item is; r: the lab's risk aversion</text>
<text class="fg-accent-text" x="270" y="58" text-anchor="start" style="font-size:11px" >M  improvability: how cheaply effort moves the item. Estimated</text>
<text class="fg-accent-text" x="270" y="72" text-anchor="start" style="font-size:11px" >from what a 10% gain costs on the EvoLM 4B suite (Table 1):</text>
<rect class="fg-soft" x="15" y="88" width="575" height="24"/>
<text class="fg-text" x="20" y="104" text-anchor="start" font-weight="700">improvability</text>
<text class="fg-text" x="105" y="104" text-anchor="start" font-weight="700">benchmark</text>
<text class="fg-text" x="238" y="104" text-anchor="start" font-weight="700">topic</text>
<text class="fg-text" x="458" y="104" text-anchor="middle" font-weight="700">cheapest axis</text>
<text class="fg-text" x="585" y="104" text-anchor="end" font-weight="700">cost (10% gain)</text>
<line class="fg-line" x1="15" y1="112" x2="590" y2="112" stroke-width=".8"/>
<text class="fg-text" x="20" y="128" text-anchor="start" style="font-size:11.5px" >10% quantile</text>
<text class="fg-text" x="105" y="128" text-anchor="start" style="font-size:11.5px" >HellaSwag</text>
<text class="fg-text" x="238" y="128" text-anchor="start" style="font-size:11.5px" >performing tricks with trained dogs</text>
<text class="fg-accent-text" x="458" y="128" text-anchor="middle" style="font-size:11.5px" >SFT</text>
<text class="fg-text" x="585" y="128" text-anchor="end" style="font-size:11.5px" >$385</text>
<line class="fg-line" x1="15" y1="136" x2="590" y2="136" stroke-width=".8"/>
<text class="fg-text" x="20" y="152" text-anchor="start" style="font-size:11.5px" >50% quantile</text>
<text class="fg-text" x="105" y="152" text-anchor="start" style="font-size:11.5px" >MathQA</text>
<text class="fg-text" x="238" y="152" text-anchor="start" style="font-size:11.5px" >finding a number from a ratio and LCM</text>
<text class="fg-accent-text" x="458" y="152" text-anchor="middle" style="font-size:11.5px" >RL</text>
<text class="fg-text" x="585" y="152" text-anchor="end" style="font-size:11.5px" >$4.2k</text>
<line class="fg-line" x1="15" y1="160" x2="590" y2="160" stroke-width=".8"/>
<text class="fg-text" x="20" y="176" text-anchor="start" style="font-size:11.5px" >90% quantile</text>
<text class="fg-text" x="105" y="176" text-anchor="start" style="font-size:11.5px" >MMLU (accounting)</text>
<text class="fg-text" x="238" y="176" text-anchor="start" style="font-size:11.5px" >modifying report for financial stmts.</text>
<text class="fg-accent-text" x="458" y="176" text-anchor="middle" style="font-size:11.5px" >PT</text>
<text class="fg-text" x="585" y="176" text-anchor="end" style="font-size:11.5px" >$37k</text>
<line class="fg-line" x1="15" y1="184" x2="590" y2="184"/>
<text class="fg-small" x="20" y="200" text-anchor="start" >Cheapest axis across all items: supervised fine-tuning (SFT) for 50%, reinforcement learning (RL) for 35%, pretraining (PT) for 14%.</text>
<text class="fg-small" x="20" y="212" text-anchor="start" >Cheaper to move ⇒ larger M ⇒ larger optimal weight; uniform weights steer labs toward SFT-tractable items.</text>
</svg>
