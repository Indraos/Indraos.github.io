<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-labelledby="benchmark-weights-title">
<title id="benchmark-weights-title">The optimal item weights depend on welfare, improvability and variance; improvability is estimated from the cost of improving items by pretraining, SFT and RL.</title>
<defs><marker id="benchmark-weights-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<text class="fg-text" x="150" y="48" text-anchor="middle" style="font-size:24px;font-family:Palatino Linotype, Palatino, serif"><tspan style="font-style:italic">v</tspan>* = (<tspan class="fg-accent-text" style="font-size:24px">M</tspan> + <tspan style="font-style:italic">r</tspan>Σ)⁻¹ <tspan class="fg-accent-text" style="font-size:24px">M</tspan> <tspan style="font-style:italic">w</tspan></text>
<text class="fg-muted" x="150" y="68" text-anchor="middle" >optimal weight of each benchmark item</text>
<text class="fg-small" x="20" y="100" text-anchor="start" >w  welfare: how much the item matters</text>
<text class="fg-small" x="20" y="114" text-anchor="start" >Σ  variance: how noisy the item is (r: risk aversion)</text>
<text class="fg-accent-text" x="20" y="136" text-anchor="start" style="font-size:11px" >M  improvability: how far a unit of</text>
<text class="fg-accent-text" x="20" y="150" text-anchor="start" style="font-size:11px" >effort moves the item, estimated from</text>
<text class="fg-accent-text" x="20" y="164" text-anchor="start" style="font-size:11px" >the cost of training (table) →</text>
<text class="fg-text" x="445.0" y="44" text-anchor="middle" font-weight="700">cost of improving an item by one unit</text>
<rect class="fg-soft" x="300" y="60" width="290" height="26"/>
<text class="fg-text" x="427.5" y="77" text-anchor="middle" font-weight="700">pretraining</text>
<text class="fg-text" x="492.5" y="77" text-anchor="middle" font-weight="700">SFT</text>
<text class="fg-text" x="557.5" y="77" text-anchor="middle" font-weight="700">RL</text>
<line class="fg-line" x1="300" y1="86" x2="590" y2="86" stroke-width=".8"/>
<text class="fg-text" x="306" y="103" text-anchor="start" >item group 1</text>
<text class="fg-text" x="427.5" y="103" text-anchor="middle" >?</text>
<text class="fg-text" x="492.5" y="103" text-anchor="middle" >?</text>
<text class="fg-text" x="557.5" y="103" text-anchor="middle" >?</text>
<line class="fg-line" x1="300" y1="112" x2="590" y2="112" stroke-width=".8"/>
<text class="fg-text" x="306" y="129" text-anchor="start" >item group 2</text>
<text class="fg-text" x="427.5" y="129" text-anchor="middle" >?</text>
<text class="fg-text" x="492.5" y="129" text-anchor="middle" >?</text>
<text class="fg-text" x="557.5" y="129" text-anchor="middle" >?</text>
<line class="fg-line" x1="300" y1="138" x2="590" y2="138" stroke-width=".8"/>
<text class="fg-text" x="306" y="155" text-anchor="start" >item group 3</text>
<text class="fg-text" x="427.5" y="155" text-anchor="middle" >?</text>
<text class="fg-text" x="492.5" y="155" text-anchor="middle" >?</text>
<text class="fg-text" x="557.5" y="155" text-anchor="middle" >?</text>
<line class="fg-line" x1="300" y1="164" x2="590" y2="164"/>
<text class="fg-small" x="300" y="182" text-anchor="start" >cheaper to move ⇒ larger M ⇒ larger weight</text>
</svg>
