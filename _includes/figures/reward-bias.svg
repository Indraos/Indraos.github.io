<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-labelledby="reward-bias-title">
<title id="reward-bias-title">Penalizing length lowers the length bias but raises overconfidence: optimization pressure is redirected rather than removed.</title>
<defs><marker id="reward-bias-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<text class="fg-text" x="100" y="35" text-anchor="middle" font-weight="700">before mitigation</text>
<line class="fg-line" x1="40" y1="165" x2="160" y2="165"/>
<rect class="fg-accent" x="55" y="65" width="36" height="100" rx="3"/>
<rect class="fg-grey" x="109" y="135" width="36" height="30" rx="3"/>
<text class="fg-small" x="73" y="179" text-anchor="middle" >length</text>
<text class="fg-small" x="73" y="191" text-anchor="middle" >bias</text>
<text class="fg-small" x="127" y="179" text-anchor="middle" >over-</text>
<text class="fg-small" x="127" y="191" text-anchor="middle" >confidence</text>
<text class="fg-text" x="290" y="35" text-anchor="middle" font-weight="700">after a length penalty</text>
<line class="fg-line" x1="230" y1="165" x2="350" y2="165"/>
<rect class="fg-grey" x="245" y="140" width="36" height="25" rx="3"/>
<rect class="fg-accent" x="299" y="60" width="36" height="105" rx="3"/>
<text class="fg-small" x="263" y="179" text-anchor="middle" >length</text>
<text class="fg-small" x="263" y="191" text-anchor="middle" >bias</text>
<text class="fg-small" x="317" y="179" text-anchor="middle" >over-</text>
<text class="fg-small" x="317" y="191" text-anchor="middle" >confidence</text>
<line class="fg-line" x1="168" y1="95" x2="222" y2="95" marker-end="url(#reward-bias-arrow)"/>
<text class="fg-small" x="195" y="85" text-anchor="middle" >pressure</text>
<text class="fg-small" x="195" y="112" text-anchor="middle" >moves</text>
<text class="fg-small" x="400" y="60" text-anchor="start" >A single-axis fix redirects</text>
<text class="fg-small" x="400" y="72" text-anchor="start" >optimization pressure. On the</text>
<text class="fg-small" x="400" y="84" text-anchor="start" >usual audit distribution, success,</text>
<text class="fg-small" x="400" y="96" text-anchor="start" >substitution and overcorrection</text>
<text class="fg-small" x="400" y="108" text-anchor="start" >look the same.</text>
<text class="fg-accent-text" x="400" y="136" text-anchor="start" style="font-size:11px">Evaluate under the policy-induced</text>
<text class="fg-accent-text" x="400" y="150" text-anchor="start" style="font-size:11px">distribution; track several biases.</text>
</svg>
