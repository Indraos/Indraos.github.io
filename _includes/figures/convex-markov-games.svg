<ellipse class="fg-accent-line" cx="425" cy="130" rx="36" ry="28" stroke-width="1.2"/>
<ellipse class="fg-accent-line" cx="425" cy="130" rx="60" ry="46" stroke-width="1.2"/>
<ellipse class="fg-accent-line" cx="425" cy="130" rx="86" ry="66" stroke-width="1.2"/>
<ellipse class="fg-accent-line" cx="425" cy="130" rx="117" ry="90" stroke-width="1.2"/>
<circle class="fg-accent" cx="425" cy="130" r="3.5"/>
