<line class="fg-accent-line" x1="192" y1="180" x2="262" y2="30" stroke-width="1.2"/>
<line class="fg-accent-line" x1="220" y1="180" x2="290" y2="30" stroke-width="1.2"/>
<line class="fg-accent-line" x1="248" y1="180" x2="318" y2="30" stroke-width="1.2"/>
<line class="fg-accent-line" x1="276" y1="180" x2="346" y2="30" stroke-width="1.2"/>
</g>
<path class="fg-line" d="M50,170 L230,170 L140,40 Z"/>
<text class="fg-text" x="140" y="28" text-anchor="middle" font-weight="700">Markov game</text>
<text class="fg-small" x="140" y="190" text-anchor="middle" >linear reward: parallel level sets</text>
