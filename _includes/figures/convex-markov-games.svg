<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-labelledby="convex-markov-games-title">
<title id="convex-markov-games-title">In a Markov game, preferences over occupancy measures are linear; in a convex Markov game they can be any convex function, which allows objectives such as diversity, imitation, fairness and safety.</title>
<defs><marker id="convex-markov-games-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<clipPath id="convex-markov-games-clip0"><path d="M50,170 L230,170 L140,40 Z"/></clipPath>
