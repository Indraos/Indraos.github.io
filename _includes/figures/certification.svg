<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-labelledby="certification-title">
<title id="certification-title">A certifier partitions unobservable seller quality into priced certificate tiers; sellers sort into them.</title>
<defs><marker id="certification-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<line class="fg-line" x1="60" y1="150" x2="550" y2="150" marker-end="url(#certification-arrow)"/>
<text class="fg-small" x="550" y="166" text-anchor="end" >seller quality (unobservable to buyers)</text>
<rect class="fg-softer" x="60" y="60" width="140" height="90" />
<line class="fg-dash" x1="200" y1="55" x2="200" y2="150"/>
<text class="fg-text" x="130.0" y="78" text-anchor="middle" font-weight="700">no certificate</text>
<rect class="fg-soft" x="200" y="60" width="130" height="90" />
<line class="fg-dash" x1="330" y1="55" x2="330" y2="150"/>
<text class="fg-text" x="265.0" y="78" text-anchor="middle" font-weight="700">certificate 1</text>
<text class="fg-accent-text" x="265.0" y="94" text-anchor="middle" style="font-size:11px">price p₁</text>
<rect class="fg-soft" x="330" y="60" width="110" height="90" />
<line class="fg-dash" x1="440" y1="55" x2="440" y2="150"/>
<text class="fg-text" x="385.0" y="78" text-anchor="middle" font-weight="700">certificate 2</text>
<text class="fg-accent-text" x="385.0" y="94" text-anchor="middle" style="font-size:11px">price p₂</text>
<rect class="fg-soft" x="440" y="60" width="100" height="90" />

<text class="fg-text" x="490.0" y="78" text-anchor="middle" font-weight="700">certificate 3</text>
<text class="fg-accent-text" x="490.0" y="94" text-anchor="middle" style="font-size:11px">price p₃</text>
<circle class="fg-accent" cx="178.4" cy="132.5" r="3"/>
