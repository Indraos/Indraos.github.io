<text class="fg-small" x="60" y="40" text-anchor="start" >The certifier chooses the tiers and their prices; sellers choose quality and a certificate;</text>
<text class="fg-small" x="60" y="52" text-anchor="start" >prices form competitively. Under single crossing, each seller's choice is pinned down.</text>
<text class="fg-small" x="60" y="190" text-anchor="start" >• sellers (choose quality and certificate)</text>
<text class="fg-small" x="330" y="190" text-anchor="start" >Optimal menus can be arbitrarily large.</text>
</svg>
