<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-labelledby="contextually-private-title">
<title id="contextually-private-title">An ascending-join auction: bidders A and B are in the clock first; C joins at the current price and is never asked about lower values.</title>
<defs><marker id="contextually-private-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<line class="fg-line" x1="70" y1="185" x2="70" y2="25" marker-end="url(#contextually-private-arrow)"/>
<text class="fg-text" x="62" y="30" text-anchor="end" >price</text>
<text class="fg-small" x="62" y="189" text-anchor="end" >0</text>
<line class="fg-dash" x1="70" y1="120" x2="440" y2="120"/>
<text class="fg-small" x="62" y="124" text-anchor="end" >p₁</text>
<line class="fg-dash" x1="70" y1="60" x2="440" y2="60"/>
<text class="fg-small" x="62" y="64" text-anchor="end" >p₂</text>
<text class="fg-text" x="160" y="205" text-anchor="middle" >bidder A</text>
<text class="fg-text" x="270" y="205" text-anchor="middle" >bidder B</text>
<text class="fg-text" x="380" y="205" text-anchor="middle" >bidder C</text>
<rect class="fg-accent" x="148" y="60" width="24" height="125" rx="3" opacity=".85"/>
<rect class="fg-grey" x="258" y="120" width="24" height="65" rx="3"/>
<rect class="fg-grey" x="368" y="60" width="24" height="60" rx="3"/>
<rect class="fg-dash" x="368" y="120" width="24" height="65" rx="3"/>
<text class="fg-accent-text" x="160" y="52" text-anchor="middle" >wins at p₂</text>
<text class="fg-small" x="270" y="112" text-anchor="middle" >drops out at p₁</text>
<text class="fg-small" x="380" y="52" text-anchor="middle" >drops out at p₂</text>
<text class="fg-small" x="398" y="150" text-anchor="start" >never asked</text>
<text class="fg-small" x="398" y="162" text-anchor="start" >about values</text>
<text class="fg-small" x="398" y="174" text-anchor="start" >below p₁</text>
<line class="fg-line" x1="286" y1="130" x2="364" y2="123" marker-end="url(#contextually-private-arrow)"/>
<text class="fg-small" x="318" y="146" text-anchor="middle" >C joins at the</text>
<text class="fg-small" x="318" y="158" text-anchor="middle" >current price</text>
<rect class="fg-accent" x="455" y="40" width="12" height="12" rx="2" opacity=".85"/>
<text class="fg-small" x="472" y="50" text-anchor="start" >in the clock, wins</text>
<rect class="fg-grey" x="455" y="60" width="12" height="12" rx="2"/>
<text class="fg-small" x="472" y="70" text-anchor="start" >in the clock, drops out</text>
<rect class="fg-dash" x="455" y="80" width="12" height="12" rx="2"/>
<text class="fg-small" x="472" y="90" text-anchor="start" >value range not learned</text>
<text class="fg-text" x="455" y="120" text-anchor="start" font-weight="700">Ascending-join protocol:</text>
<text class="fg-small" x="455" y="136" text-anchor="start" >the clock runs on two bidders</text>
<text class="fg-small" x="455" y="148" text-anchor="start" >at a time; the others join at</text>
<text class="fg-small" x="455" y="160" text-anchor="start" >the current price. The auction</text>
<text class="fg-small" x="455" y="172" text-anchor="start" >learns only what the outcome</text>
<text class="fg-small" x="455" y="184" text-anchor="start" >needs.</text>
</svg>
