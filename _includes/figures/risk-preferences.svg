<text class="fg-small" x="210.0" y="28" text-anchor="middle" >same expected payoff</text>
<text class="fg-accent-text" x="242.0" y="62" text-anchor="start" style="font-size:11px">low-variance action</text>
<text class="fg-accent-text" x="242.0" y="76" text-anchor="start" style="font-size:11px">chosen with probability → 1</text>
<text class="fg-small" x="60" y="118" text-anchor="start" >high-variance</text>
<text class="fg-small" x="60" y="130" text-anchor="start" >action</text>
<text class="fg-text" x="410" y="60" text-anchor="start" font-weight="700">ε-greedy bandits are</text>
<text class="fg-text" x="410" y="76" text-anchor="start" font-weight="700">emergently risk-averse:</text>
<text class="fg-small" x="410" y="96" text-anchor="start" >unlucky early draws make a</text>
<text class="fg-small" x="410" y="108" text-anchor="start" >risky action look bad, and it</text>
<text class="fg-small" x="410" y="120" text-anchor="start" >is then rarely tried again.</text>
<text class="fg-small" x="410" y="144" text-anchor="start" >Reweighting data by choice</text>
<text class="fg-small" x="410" y="156" text-anchor="start" >frequency, or optimism for</text>
<text class="fg-small" x="410" y="168" text-anchor="start" >rarely-chosen actions, restores</text>
<text class="fg-small" x="410" y="180" text-anchor="start" >risk neutrality.</text>
