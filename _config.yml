# Site settings and identity. Content collections (publications, vita,
# honors, ...) live in _data/; the CV and resume are built from both by
# cv/build.py (see .github/workflows/pages.yml).

title: Andreas Haupt
name: "Andreas Haupt"
description: |
  Personal website of Andy Haupt.
url: "https://andyhaupt.com/"
baseurl: "/"

positions:
  - title: "AI Institute Fellow-in-Residence"
    employer: "Schmidt Sciences"
  - title: "Digital Fellow"
    employer: "Stanford Digital Economy Lab"
  - title: "Technology and Human Rights Fellow"
    employer: "Harvard Kennedy School"
profile_pic: "assets/img/press/informal_headshot.jpg"
email: "mailto:h4upt@stanford.edu"
social:
  twitter: "https://x.com/andreas_h0wpt"
  github:  "https://www.github.com/indraos"
  linkedin: "https://www.linkedin.com/in/indraos"
  facebook: "https://www.facebook.com/indraos"
  google: "https://scholar.google.com/citations?hl=en&user=O6NknDYAAAAJ"

# One sentence on the research program, shared by the bio on the website
# ("He studies ...") and the CV/resume ("I study ..."). Markdown links allowed.
research: "how algorithmic systems represent and are evaluated against diverse human preferences, using methods from [microeconomic theory](https://dl.acm.org/doi/10.1145/3670865.3673593), [structural econometrics](https://papers.ssrn.com/abstract_id=5126918), and [reinforcement learning](https://link.springer.com/article/10.1007/s10458-024-09682-5)"

# Built by the Pages workflow from cv/ (not committed).
cv: "assets/cv/cv.pdf"
resume: "assets/cv/resume.pdf"
cv_source: "assets/cv/cv-latex.zip"

# Publication types (see _data/publications.yml); only the first type is
# shown until another is selected.
paper_types:
  - "Published"
  - "Preprint"
  - "Art"
  - "Thesis"
  - "Event"

# Press photos, offered for download under "Media Assets".
defaults:
  - scope:
      path: "assets/img/press"
    values:
      media: true

exclude:
  - cv/
  - README.md
  - LICENSE
