<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ site.name }} | {{ page.title }}</title>
  <meta name="description" content=" {{ site.name }}">
  <meta name="author" content="{{ site.name}}">
  <meta property="og:title" content="{{ site.name }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content=" {{ site.url }}" />
  <meta property="og:site_name" content="{{ site.name }}" />
  <meta property="og:image" content="{{ site.baseurl }}{{ site.profile_pic }}" />
  <meta property="og:description" content="{{ site.description }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="{{ site.url }}" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="{{ "assets/css/timeline.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "assets/css/main.css" | prepend: site.baseurl }}">

</head>
<body>
  <div class="container">
    {% include header.html %}

    {{ content }}

    {% include footer.html %}
  </div>
  <script src="{{ "assets/js/filters.js" | prepend: site.baseurl }}"></script>
</body>
</html>
